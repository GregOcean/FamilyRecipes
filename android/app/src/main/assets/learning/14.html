<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font:18px/1.75 sans-serif;margin:24px;background:#fffaf4;color:#302820}h1{font-size:26px}h2{font-size:23px}p{overflow-wrap:anywhere}img{max-width:100%}a{color:#a8492e}@media(prefers-color-scheme:dark){body{background:#211c19;color:#f6eee6}a{color:#ffba98}}</style></head><body><h1>煮</h1><h2>流程</h2><p>倒水入锅——开火，将锅放于火上加热——水开（水翻滚，有大量气泡冒出）后放入食材</p><h3>注意事项</h3><p>* 加热时盖上锅盖可以加快受热。<strong>但这样做有溢锅的风险</strong>。持续加热后，过渡翻腾的流体可能会冒出锅外，这就是溢锅。</p><p>* <strong>若即将溢锅，立刻关小火并打开锅盖即可。</strong></p><p>* 想要加快受热又避免溢锅，可以半开锅盖，留出气体出口；也可在后期关小火，并时时注意锅中情况。</p><p>* 根据烹饪需要，食材也可冷水下锅。不过这样水烧开需要的时间更久。</p></body></html>
