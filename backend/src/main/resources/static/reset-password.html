<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家肴 · 重置密码</title><link rel="stylesheet" href="/admin/style.css"><script src="/reset-password.js" defer></script></head><body><main><section class="card narrow"><a href="/">← 家肴 Family Recipes</a><h1>重置密码 / Reset password</h1><p>输入注册邮箱获取验证码。<br>Enter your registered email to receive a code.</p><form id="reset"><label>邮箱 / Email<input id="email" type="email" autocomplete="email" required maxlength="100"></label><button type="button" id="send">发送验证码 / Send code</button><label>验证码 / Code<input id="code" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required maxlength="6"></label><label>新密码 / New password<input id="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72"></label><label>确认密码 / Confirm password<input id="confirm" type="password" autocomplete="new-password" required minlength="8" maxlength="72"></label><button id="submit">重置密码 / Reset password</button></form><p id="message" role="status"></p></section></main></body></html>
