server:
  port: 8080

spring:
  task:
    scheduling:
      pool:
        size: 3
  mail:
    host: ${SMTP_HOST:127.0.0.1}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:false}
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS:false}
      "[mail.smtp.ssl.enable]": ${SMTP_SSL:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  application:
    name: family-recipes-backend
  
  # MySQL配置
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/family_recipes?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:familyrecipes}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # 数据库初始化
  sql:
    init:
      mode: never
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  
  # Jackson JSON配置
  jackson:
    property-naming-strategy: SNAKE_CASE  # 支持蛇形命名（ingredient_id）
    deserialization:
      fail-on-unknown-properties: false   # 忽略未知字段
    serialization:
      write-dates-as-timestamps: false    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.familyrecipes.entity
  configuration:
    map-underscore-to-camel-case: true
    local-cache-scope: STATEMENT

# JWT配置
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000  # 7天，单位毫秒

# 文件存储路径
file:
  upload-dir: ${MEDIA_DIR:./uploads/}
  base-url: ${PUBLIC_BASE_URL:http://localhost:8080}/api/upload/files/

# 日志配置
logging:
  level:
    com.familyrecipes: INFO
    org.springframework.web: INFO


app:
  classification:
    enabled: ${RECIPE_CLASSIFICATION_ENABLED:false}
    poll-ms: ${RECIPE_CLASSIFICATION_POLL_MS:10000}
  email:
    from: ${SMTP_FROM:noreply@familyrecipes.test}
    code-secret: ${EMAIL_CODE_SECRET:${JWT_SECRET}}
  translation:
    enabled: ${TRANSLATION_ENABLED:false}
    version: ${TRANSLATION_VERSION:v1}
    poll-ms: ${TRANSLATION_POLL_MS:2000}
  catalog:
    admin-user-id: ${CATALOG_ADMIN_USER_ID:0}
  ai:
    routes:
      translation:
        url: ${TRANSLATION_LLM_URL:https://open.bigmodel.cn/api/paas/v4/chat/completions}
        key: ${TRANSLATION_LLM_KEY:${ZHIPU_API_KEY:}}
        model: ${TRANSLATION_LLM_MODEL:glm-5.3-flash}
        reasoning-effort: ${TRANSLATION_REASONING_EFFORT:low}
        timeout-seconds: 120
        max-tokens: 8192
      # Receipt and item-photo tasks share one end-to-end vision model.
      vision:
        url: ${VISION_LLM_URL:https://open.bigmodel.cn/api/paas/v4/chat/completions}
        key: ${VISION_LLM_KEY:${ZHIPU_API_KEY:}}
        model: ${VISION_LLM_MODEL:glm-4.6v-flash}
        thinking-type: ${VISION_THINKING_TYPE:disabled}
        reasoning-effort: ${VISION_REASONING_EFFORT:}
        timeout-seconds: ${VISION_TIMEOUT_SECONDS:45}
        max-tokens: ${VISION_MAX_TOKENS:2048}
